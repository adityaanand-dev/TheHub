name: TheHub CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==============================================================================
  # Job 1: Backend Test & Build
  # ==============================================================================
  backend-ci:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Backend Tests
        run: |
          cd backend
          mvn -B test

      - name: Package Executable JAR
        run: |
          cd backend
          mvn -B package -DskipTests

      - name: Archive Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 5

  # ==============================================================================
  # Job 2: Frontend Test & Build
  # ==============================================================================
  frontend-ci:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Archive Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  # ==============================================================================
  # Job 3: Docker Build & Compose Image Validation
  # ==============================================================================
  docker-validation:
    name: Docker Container Image Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: thehub-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: thehub-frontend:ci-test

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
