events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Client Max Body Size for File/Media Uploads
        client_max_body_size 20M;

        # Gzip compression
        gzip on;
        gzip_comp_level 5;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Backend API Routing with Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health & Actuator Endpoint
        location /actuator/ {
            proxy_pass http://backend_upstream/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger Docs
        location /swagger-ui/ {
            proxy_pass http://backend_upstream/swagger-ui/;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://backend_upstream/v3/api-docs;
            proxy_set_header Host $host;
        }

        # Frontend SPA Routing
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
